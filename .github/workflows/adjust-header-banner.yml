name: Ajuster la bannière du header

on:
  push:
    branches: [feature/full-header-banner]

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: feature/full-header-banner

      - name: Modifier le header
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/Header.astro')
          text = path.read_text(encoding='utf-8')

          old = '''    <div class="container branding-inner">
      <a class="site-logo" href={base} aria-label="AuvergneInfo, accueil">
        <span>AUVERGNE</span><span class="logo-accent">INFO</span>
      </a>
      <div class="header-ad" aria-label="Bannière AuvergneInfo">'''
          new = '''    <div class="container branding-inner branding-banner-only">
      <a class="header-ad header-ad-full" href={base} aria-label="AuvergneInfo, accueil">'''
          if old not in text:
              raise SystemExit('Bloc branding attendu introuvable')
          text = text.replace(old, new, 1)

          old_close = '''        <span class="header-ad-fallback">AUVERGNEINFO.FR</span>
      </div>
    </div>
  </div>'''
          new_close = '''        <span class="header-ad-fallback">AUVERGNEINFO.FR</span>
      </a>
    </div>
  </div>'''
          if old_close not in text:
              raise SystemExit('Fin du bloc branding introuvable')
          text = text.replace(old_close, new_close, 1)

          marker = '''<style>
  .ticker-shell .ticker-track {'''
          replacement = '''<style>
  .branding-inner.branding-banner-only {
    min-height: 0;
    display: flex;
    justify-content: center;
    padding-top: 22px;
    padding-bottom: 22px;
  }

  .header-ad.header-ad-full {
    display: block;
    width: min(100%, 1200px);
    height: auto;
    max-width: none;
    overflow: visible;
    background: transparent;
    text-decoration: none;
  }

  .header-ad.header-ad-full img {
    display: block;
    width: 100%;
    height: auto;
    max-height: none;
    object-fit: contain;
  }

  @media (max-width: 720px) {
    .branding-inner.branding-banner-only {
      padding-top: 14px;
      padding-bottom: 14px;
    }
  }

  .ticker-shell .ticker-track {'''
          if marker not in text:
              raise SystemExit('Bloc style attendu introuvable')
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le build Astro
        run: npm run build

      - name: Enregistrer la modification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.astro
          git commit -m "Afficher la bannière complète dans le header" || exit 0
          git push
