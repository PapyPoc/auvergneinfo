name: Déployer une VM Proxmox

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'deploy/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-proxmox-vm.yml'
  workflow_dispatch:
    inputs:
      hostname:
        description: "Hostname Debian / nom de la VM Proxmox"
        required: true
        default: "web-auvergneinfo"
        type: string
      cores:
        description: "Nombre de vCPU (création uniquement)"
        required: true
        default: "2"
        type: string
      memory_mb:
        description: "Mémoire en Mo (création uniquement)"
        required: true
        default: "2048"
        type: string
      disk_grow_gb:
        description: "Espace à ajouter au disque du template en Go (création uniquement)"
        required: true
        default: "0"
        type: string
      start_vm:
        description: "Démarrer la VM et déployer le site"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: proxmox-web-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provisionner ou mettre à jour AuvergneInfo
    runs-on: [self-hosted, linux, x64, auvergneinfo]
    timeout-minutes: 40

    env:
      PROXMOX_HOST: "10.0.0.253"
      PROXMOX_PORT: "8006"
      TEMPLATE_VMID: "200"
      TEMPLATE_NAME: "debian13-cloudinit"
      STORAGE: "local-btrfs"
      BRIDGE: "vmbr0"
      VMID_MIN: "300"
      VMID_MAX: "304"
      STATIC_IP_FIRST: "151"
      STATIC_IP_LAST: "155"
      NETWORK_CIDR: "24"
      NETWORK_GATEWAY: "10.0.0.254"
      NETWORK_DNS: "10.0.0.254"
      CI_USER: "poc"
      WEB_ROOT: "/var/www/auvergneinfo"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer les dépendances Astro
        run: npm install

      - name: Construire le site pour auvergneinfo.fr
        run: npm run build
        env:
          PAGES_ORIGIN: https://auvergneinfo.fr
          PAGES_BASE_PATH: ""

      - name: Provisionner la VM ou mettre le site à jour
        id: deploy
        shell: bash
        env:
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SUDO_PASSWORD: ${{ secrets.VM_SUDO_PASSWORD }}
          VM_HOSTNAME: ${{ inputs.hostname || 'web-auvergneinfo' }}
          CORES: ${{ inputs.cores || '2' }}
          MEMORY_MB: ${{ inputs.memory_mb || '2048' }}
          DISK_GROW_GB: ${{ inputs.disk_grow_gb || '0' }}
          START_VM: ${{ github.event_name != 'workflow_dispatch' || inputs.start_vm }}
        run: bash deploy/scripts/provision-and-deploy.sh
