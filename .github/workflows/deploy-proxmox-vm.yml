name: Déployer une VM Proxmox

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Hostname Debian / nom de la VM Proxmox"
        required: true
        default: "web-auvergneinfo"
        type: string
      cores:
        description: "Nombre de vCPU (utilisé uniquement à la création)"
        required: true
        default: "2"
        type: string
      memory_mb:
        description: "Mémoire en Mo (utilisée uniquement à la création)"
        required: true
        default: "2048"
        type: string
      disk_grow_gb:
        description: "Espace à AJOUTER au disque du template, en Go (création uniquement)"
        required: true
        default: "0"
        type: string
      start_vm:
        description: "Démarrer la VM et déployer le site"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: proxmox-web-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Provisionner ou mettre à jour AuvergneInfo
    runs-on: [self-hosted, linux, x64, auvergneinfo]
    timeout-minutes: 40

    env:
      PROXMOX_HOST: "10.0.0.253"
      PROXMOX_PORT: "8006"
      TEMPLATE_VMID: "200"
      TEMPLATE_NAME: "debian13-cloudinit"
      STORAGE: "local-btrfs"
      BRIDGE: "vmbr0"
      VMID_MIN: "300"
      VMID_MAX: "304"
      STATIC_IP_FIRST: "151"
      STATIC_IP_LAST: "155"
      NETWORK_CIDR: "24"
      NETWORK_GATEWAY: "10.0.0.254"
      NETWORK_DNS: "10.0.0.254"
      CI_USER: "poc"
      WEB_ROOT: "/var/www/auvergneinfo"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Vérifier les prérequis
        shell: bash
        env:
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          START_VM: ${{ inputs.start_vm }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          command -v curl >/dev/null || fail "curl est requis sur runner-git."
          command -v python3 >/dev/null || fail "python3 est requis sur runner-git."
          command -v ssh >/dev/null || fail "openssh-client est requis sur runner-git."
          command -v scp >/dev/null || fail "scp est requis sur runner-git."
          command -v ssh-keygen >/dev/null || fail "ssh-keygen est requis sur runner-git."
          command -v tar >/dev/null || fail "tar est requis sur runner-git."

          [ -n "${PROXMOX_TOKEN_ID:-}" ] || fail "Secret PROXMOX_TOKEN_ID absent."
          [ -n "${PROXMOX_TOKEN_SECRET:-}" ] || fail "Secret PROXMOX_TOKEN_SECRET absent."

          if [ "$START_VM" = "true" ]; then
            [ -n "${VM_SSH_PRIVATE_KEY:-}" ] || fail "Secret VM_SSH_PRIVATE_KEY absent."

            KEY_TEST_FILE="$(mktemp)"
            trap 'rm -f "$KEY_TEST_FILE"' EXIT
            printf '%s\n' "$VM_SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_TEST_FILE"
            chmod 600 "$KEY_TEST_FILE"

            if ! SSH_KEY_ERROR="$(ssh-keygen -y -P '' -f "$KEY_TEST_FILE" 2>&1 >/dev/null)"; then
              fail "VM_SSH_PRIVATE_KEY n'est pas une clé privée SSH valide ou utilisable sans passphrase. Détail : ${SSH_KEY_ERROR:-format invalide}"
            fi

            echo "Clé privée SSH valide."
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer les dépendances Astro
        run: npm install

      - name: Construire le site pour auvergneinfo.fr
        run: npm run build
        env:
          PAGES_ORIGIN: https://auvergneinfo.fr
          PAGES_BASE_PATH: ""

      - name: Provisionner ou réutiliser la VM
        id: create_vm
        shell: bash
        env:
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_HOSTNAME: ${{ inputs.hostname }}
          CORES: ${{ inputs.cores }}
          MEMORY_MB: ${{ inputs.memory_mb }}
          DISK_GROW_GB: ${{ inputs.disk_grow_gb }}
          START_VM: ${{ inputs.start_vm }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          PROXMOX_TOKEN_ID="$(printf '%s' "${PROXMOX_TOKEN_ID:-}" | python3 -c 'import sys; print(sys.stdin.read().strip())')"
          PROXMOX_TOKEN_SECRET="$(printf '%s' "${PROXMOX_TOKEN_SECRET:-}" | python3 -c 'import sys; print(sys.stdin.read().strip())')"

          [[ "$PROXMOX_TOKEN_ID" =~ ^[^[:space:]]+@[^[:space:]!]+![^[:space:]]+$ ]] \
            || fail "PROXMOX_TOKEN_ID invalide. Format attendu : utilisateur@realm!token."
          [[ "$VM_HOSTNAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,62}$ ]] \
            || fail "Nom de VM invalide : $VM_HOSTNAME"
          [[ "$CORES" =~ ^[0-9]+$ ]] && (( CORES >= 1 && CORES <= 64 )) \
            || fail "Nombre de vCPU invalide."
          [[ "$MEMORY_MB" =~ ^[0-9]+$ ]] && (( MEMORY_MB >= 512 )) \
            || fail "Mémoire invalide (minimum 512 Mo)."
          [[ "$DISK_GROW_GB" =~ ^[0-9]+$ ]] \
            || fail "disk_grow_gb doit être un entier positif ou 0."

          API="https://${PROXMOX_HOST}:${PROXMOX_PORT}/api2/json"
          AUTH_HEADER="Authorization: PVEAPIToken=${PROXMOX_TOKEN_ID}=${PROXMOX_TOKEN_SECRET}"

          api_request() {
            local method="$1"
            local path="$2"
            shift 2

            local body_file http_code body
            body_file="$(mktemp)"

            if ! http_code="$(curl -ksS \
              -o "$body_file" \
              -w '%{http_code}' \
              -X "$method" \
              -H "$AUTH_HEADER" \
              "$@" \
              "${API}${path}")"; then
              rm -f "$body_file"
              fail "Impossible de joindre l'API Proxmox ${PROXMOX_HOST}:${PROXMOX_PORT}."
            fi

            body="$(cat "$body_file")"
            rm -f "$body_file"

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              [ -n "$body" ] || body="aucun détail retourné"
              fail "API Proxmox ${method} ${path} : HTTP ${http_code} — ${body}"
            fi

            printf '%s' "$body"
          }

          api_get() { api_request GET "$1"; }
          api_post() { local path="$1"; shift; api_request POST "$path" "$@"; }
          api_put() { local path="$1"; shift; api_request PUT "$path" "$@"; }

          json_data() {
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("data", ""))'
          }

          url_encode() {
            python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          wait_task() {
            local node="$1"
            local upid="$2"
            local encoded response status exitstatus
            encoded="$(url_encode "$upid")"

            for _ in $(seq 1 300); do
              response="$(api_get "/nodes/${node}/tasks/${encoded}/status")"
              status="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("data", {}).get("status", ""))')"

              if [ "$status" = "stopped" ]; then
                exitstatus="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("data", {}).get("exitstatus", ""))')"
                [ "$exitstatus" = "OK" ] || fail "Tâche Proxmox échouée : ${exitstatus:-inconnu}"
                return 0
              fi
              sleep 2
            done

            fail "Timeout en attente de la tâche Proxmox."
          }

          echo "Connexion à Proxmox ${PROXMOX_HOST}:${PROXMOX_PORT}..."
          cluster_resources="$(api_get "/cluster/resources?type=vm")"
          echo "Authentification API Proxmox réussie."

          existing_info="$(printf '%s' "$cluster_resources" | python3 -c '
          import json,sys
          wanted=sys.argv[1].lower()
          matches=[]
          for item in json.load(sys.stdin).get("data", []):
              if str(item.get("name", "")).lower() == wanted and not int(item.get("template", 0) or 0):
                  matches.append(item)
          if len(matches) > 1:
              print("MULTIPLE")
          elif len(matches) == 1:
              x=matches[0]
              print(f"{x.get(\"vmid\", \"\")}\t{x.get(\"node\", \"\")}\t{x.get(\"status\", \"\")}")
          ' "$VM_HOSTNAME")"

          [ "$existing_info" != "MULTIPLE" ] \
            || fail "Plusieurs VM portent le nom ${VM_HOSTNAME}. Impossible de choisir en sécurité."

          VM_REUSED="false"
          VM_STATUS="stopped"

          if [ -n "$existing_info" ]; then
            IFS=$'\t' read -r VMID node VM_STATUS <<< "$existing_info"

            [[ "$VMID" =~ ^[0-9]+$ ]] || fail "VMID existant invalide : ${VMID:-vide}."
            (( VMID >= VMID_MIN && VMID <= VMID_MAX )) \
              || fail "La VM ${VM_HOSTNAME} existe avec le VMID ${VMID}, hors du pool géré ${VMID_MIN}-${VMID_MAX}."

            EXPECTED_IP="10.0.0.$((STATIC_IP_FIRST + VMID - VMID_MIN))"
            vm_config="$(api_get "/nodes/${node}/qemu/${VMID}/config")"
            CONFIGURED_IP="$(printf '%s' "$vm_config" | python3 -c '
          import json,re,sys
          cfg=str(json.load(sys.stdin).get("data", {}).get("ipconfig0", ""))
          m=re.search(r"(?:^|,)ip=([^/,]+)(?:/\d+)?", cfg)
          print(m.group(1) if m else "")
          ')"

            [ "$CONFIGURED_IP" = "$EXPECTED_IP" ] \
              || fail "La VM ${VMID} existe mais son IP Cloud-Init (${CONFIGURED_IP:-absente}) ne correspond pas à l'IP attendue ${EXPECTED_IP}."

            VM_REUSED="true"
            echo "VM existante trouvée : ${VM_HOSTNAME} (VMID ${VMID}, ${EXPECTED_IP})."
            echo "Aucun clonage et aucune modification matérielle ne seront effectués."

            if [ "$START_VM" = "true" ] && [ "$VM_STATUS" != "running" ]; then
              echo "Démarrage de la VM existante ${VMID}..."
              start_response="$(api_post "/nodes/${node}/qemu/${VMID}/status/start")"
              start_upid="$(printf '%s' "$start_response" | json_data)"
              [ -n "$start_upid" ] || fail "Proxmox n'a pas retourné de tâche de démarrage."
              wait_task "$node" "$start_upid"
              VM_STATUS="running"
            fi
          else
            node="$(printf '%s' "$cluster_resources" | python3 -c '
          import json,sys
          target=int(sys.argv[1])
          for item in json.load(sys.stdin).get("data", []):
              if int(item.get("vmid", -1)) == target:
                  print(item.get("node", ""))
                  break
          ' "$TEMPLATE_VMID")"

            [ -n "$node" ] || fail "Template VMID ${TEMPLATE_VMID} introuvable ou non visible avec ce token."
            echo "Template ${TEMPLATE_VMID} détecté sur le nœud : ${node}"

            template_config="$(api_get "/nodes/${node}/qemu/${TEMPLATE_VMID}/config")"
            template_check="$(printf '%s' "$template_config" | python3 -c '
          import json,sys
          expected=sys.argv[1]
          data=json.load(sys.stdin).get("data", {})
          is_template=int(data.get("template", 0)) == 1
          name=str(data.get("name", ""))
          has_cloudinit=any(isinstance(v, str) and "cloudinit" in v.lower() for v in data.values())
          print("ok" if is_template and name.lower() == expected.lower() and has_cloudinit else f"template={is_template};name={name};cloudinit={has_cloudinit}")
          ' "$TEMPLATE_NAME")"

            [ "$template_check" = "ok" ] \
              || fail "Le VMID ${TEMPLATE_VMID} n'est pas le template Cloud-Init attendu ${TEMPLATE_NAME} (${template_check})."

            VMID="$(printf '%s' "$cluster_resources" | python3 -c '
          import json,sys
          minimum=int(sys.argv[1])
          maximum=int(sys.argv[2])
          used={int(x.get("vmid", -1)) for x in json.load(sys.stdin).get("data", [])}
          for vmid in range(minimum, maximum + 1):
              if vmid not in used:
                  print(vmid)
                  break
          ' "$VMID_MIN" "$VMID_MAX")"

            [ -n "$VMID" ] || fail "Pool VMID saturé : tous les VMID ${VMID_MIN}-${VMID_MAX} sont déjà utilisés."
            EXPECTED_IP="10.0.0.$((STATIC_IP_FIRST + VMID - VMID_MIN))"

            echo "Création nécessaire : ${VM_HOSTNAME} n'existe pas encore."
            echo "VMID sélectionné : ${VMID}"
            echo "IP Cloud-Init : ${EXPECTED_IP}/${NETWORK_CIDR}"

            api_get "/nodes/${node}/storage/${STORAGE}/status" >/dev/null
            api_get "/nodes/${node}/network/${BRIDGE}" >/dev/null

            clone_response="$(api_post "/nodes/${node}/qemu/${TEMPLATE_VMID}/clone" \
              --data-urlencode "newid=${VMID}" \
              --data-urlencode "name=${VM_HOSTNAME}" \
              --data-urlencode "full=1" \
              --data-urlencode "storage=${STORAGE}")"

            clone_upid="$(printf '%s' "$clone_response" | json_data)"
            [ -n "$clone_upid" ] || fail "Proxmox n'a pas retourné de tâche de clonage."
            wait_task "$node" "$clone_upid"
            echo "Clonage terminé."

            CONFIG_ARGS=(
              --data-urlencode "cores=${CORES}"
              --data-urlencode "memory=${MEMORY_MB}"
              --data-urlencode "net0=virtio,bridge=${BRIDGE}"
              --data-urlencode "onboot=1"
              --data-urlencode "ciuser=${CI_USER}"
              --data-urlencode "ipconfig0=ip=${EXPECTED_IP}/${NETWORK_CIDR},gw=${NETWORK_GATEWAY}"
              --data-urlencode "nameserver=${NETWORK_DNS}"
            )

            if [ "$START_VM" = "true" ]; then
              KEY_FILE="$(mktemp)"
              trap 'rm -f "$KEY_FILE"' EXIT
              printf '%s\n' "$VM_SSH_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
              chmod 600 "$KEY_FILE"
              VM_SSH_PUBLIC_KEY="$(ssh-keygen -y -P '' -f "$KEY_FILE")"
              CONFIG_ARGS+=(--data-urlencode "sshkeys=${VM_SSH_PUBLIC_KEY}")
            fi

            api_put "/nodes/${node}/qemu/${VMID}/config" "${CONFIG_ARGS[@]}" >/dev/null

            if (( DISK_GROW_GB > 0 )); then
              vm_config="$(api_get "/nodes/${node}/qemu/${VMID}/config")"
              boot_disk="$(printf '%s' "$vm_config" | python3 -c '
          import json,sys
          data=json.load(sys.stdin).get("data", {})
          for key in ["scsi0", "virtio0", "sata0", "ide0"]:
              value=data.get(key, "")
              if isinstance(value, str) and value and "media=cdrom" not in value.lower() and "cloudinit" not in value.lower():
                  print(key)
                  break
          ')"
              [ -n "$boot_disk" ] || fail "Impossible de déterminer le disque système à agrandir."
              api_put "/nodes/${node}/qemu/${VMID}/resize" \
                --data-urlencode "disk=${boot_disk}" \
                --data-urlencode "size=+${DISK_GROW_GB}G" >/dev/null
            fi

            if [ "$START_VM" = "true" ]; then
              echo "Démarrage de la nouvelle VM ${VMID}..."
              start_response="$(api_post "/nodes/${node}/qemu/${VMID}/status/start")"
              start_upid="$(printf '%s' "$start_response" | json_data)"
              [ -n "$start_upid" ] || fail "Proxmox n'a pas retourné de tâche de démarrage."
              wait_task "$node" "$start_upid"
              VM_STATUS="running"
            fi
          fi

          {
            echo "vmid=${VMID}"
            echo "node=${node}"
            echo "expected_ip=${EXPECTED_IP}"
            echo "vm_status=${VM_STATUS}"
            echo "reused=${VM_REUSED}"
          } >> "$GITHUB_OUTPUT"

      - name: Installer Nginx et déployer le site
        id: deploy_site
        if: ${{ inputs.start_vm == true }}
        shell: bash
        env:
          TARGET_IP: ${{ steps.create_vm.outputs.expected_ip }}
          VMID: ${{ steps.create_vm.outputs.vmid }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SUDO_PASSWORD: ${{ secrets.VM_SUDO_PASSWORD }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          SSH_KEY_FILE="$(mktemp)"
          SITE_ARCHIVE="$(mktemp --suffix=.tar.gz)"
          DEPLOY_SCRIPT="$(mktemp)"
          trap 'rm -f "$SSH_KEY_FILE" "$SITE_ARCHIVE" "$DEPLOY_SCRIPT"' EXIT

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          SSH_OPTS=(
            -i "$SSH_KEY_FILE"
            -o BatchMode=yes
            -o ConnectTimeout=5
            -o ConnectionAttempts=1
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
          )

          echo "Attente de SSH sur ${CI_USER}@${TARGET_IP}..."
          READY="false"
          for attempt in $(seq 1 60); do
            if ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" "printf READY" 2>/dev/null | grep -q READY; then
              READY="true"
              break
            fi
            sleep 5
          done
          [ "$READY" = "true" ] || fail "La VM ${VMID} ne répond pas en SSH sur ${TARGET_IP}."

          echo "SSH disponible. Attente de la fin de Cloud-Init..."
          ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" \
            "if command -v cloud-init >/dev/null 2>&1; then cloud-init status --wait; fi"

          SUDO_MODE=""
          if ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" "sudo -n true" >/dev/null 2>&1; then
            SUDO_MODE="nopasswd"
          elif [ -n "${VM_SUDO_PASSWORD:-}" ] && \
               printf '%s\n' "$VM_SUDO_PASSWORD" | ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" "sudo -S -k -p '' true" >/dev/null 2>&1; then
            SUDO_MODE="password"
          else
            fail "Le compte ${CI_USER} ne peut pas utiliser sudo sans interaction. Configure VM_SUDO_PASSWORD ou les droits sudo de la VM."
          fi

          echo "Préparation du site Astro..."
          tar -C dist -czf "$SITE_ARCHIVE" .

          cat > "$DEPLOY_SCRIPT" <<'REMOTE_SCRIPT'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          WEB_ROOT="$1"

          apt-get update
          apt-get install -y nginx

          install -d -o root -g root -m 0755 "$WEB_ROOT"
          find "$WEB_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          tar -xzf /tmp/auvergneinfo-site.tar.gz -C "$WEB_ROOT"
          chown -R www-data:www-data "$WEB_ROOT"
          find "$WEB_ROOT" -type d -exec chmod 0755 {} +
          find "$WEB_ROOT" -type f -exec chmod 0644 {} +

          install -m 0644 /tmp/auvergneinfo.conf /etc/nginx/sites-available/auvergneinfo.conf
          ln -sfn /etc/nginx/sites-available/auvergneinfo.conf /etc/nginx/sites-enabled/auvergneinfo.conf
          rm -f /etc/nginx/sites-enabled/default

          nginx -t
          systemctl enable nginx
          systemctl reload nginx || systemctl restart nginx

          rm -f /tmp/auvergneinfo-site.tar.gz /tmp/auvergneinfo.conf /tmp/auvergneinfo-deploy.sh
          REMOTE_SCRIPT

          echo "Transfert du site et de la configuration Nginx..."
          scp "${SSH_OPTS[@]}" "$SITE_ARCHIVE" \
            "${CI_USER}@${TARGET_IP}:/tmp/auvergneinfo-site.tar.gz"
          scp "${SSH_OPTS[@]}" deploy/nginx/auvergneinfo.conf \
            "${CI_USER}@${TARGET_IP}:/tmp/auvergneinfo.conf"
          scp "${SSH_OPTS[@]}" "$DEPLOY_SCRIPT" \
            "${CI_USER}@${TARGET_IP}:/tmp/auvergneinfo-deploy.sh"

          echo "Installation / mise à jour Nginx et publication du site..."
          if [ "$SUDO_MODE" = "nopasswd" ]; then
            ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" \
              "sudo -n bash /tmp/auvergneinfo-deploy.sh '$WEB_ROOT'"
          else
            printf '%s\n' "$VM_SUDO_PASSWORD" | \
              ssh "${SSH_OPTS[@]}" "${CI_USER}@${TARGET_IP}" \
                "sudo -S -k -p '' bash /tmp/auvergneinfo-deploy.sh '$WEB_ROOT'"
          fi

          echo "Vérification HTTP de ${TARGET_IP}..."
          HTTP_OK="false"
          for attempt in $(seq 1 20); do
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "http://${TARGET_IP}/" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              HTTP_OK="true"
              break
            fi
            sleep 2
          done
          [ "$HTTP_OK" = "true" ] || fail "Nginx ne retourne pas HTTP 200 sur http://${TARGET_IP}/."

          echo "Site déployé avec succès sur http://${TARGET_IP}/"
          echo "site_deployed=true" >> "$GITHUB_OUTPUT"

      - name: Résumé du déploiement
        if: always()
        shell: bash
        env:
          VMID: ${{ steps.create_vm.outputs.vmid }}
          NODE: ${{ steps.create_vm.outputs.node }}
          TARGET_IP: ${{ steps.create_vm.outputs.expected_ip }}
          VM_STATUS: ${{ steps.create_vm.outputs.vm_status }}
          VM_REUSED: ${{ steps.create_vm.outputs.reused }}
          SITE_DEPLOYED: ${{ steps.deploy_site.outputs.site_deployed }}
          VM_HOSTNAME: ${{ inputs.hostname }}
        run: |
          if [ "${VM_REUSED:-false}" = "true" ]; then
            ACTION="VM existante réutilisée / site mis à jour"
          else
            ACTION="Nouvelle VM créée"
          fi

          {
            echo "## Déploiement AuvergneInfo"
            echo ""
            echo "| Paramètre | Valeur |"
            echo "|---|---|"
            echo "| Action | ${ACTION} |"
            echo "| Proxmox | ${PROXMOX_HOST} |"
            echo "| Nœud | ${NODE:-inconnu} |"
            echo "| Template création | ${TEMPLATE_VMID} - ${TEMPLATE_NAME} |"
            echo "| VMID | ${VMID:-non créé} |"
            echo "| Nom / hostname | ${VM_HOSTNAME} |"
            echo "| IP | ${TARGET_IP:-inconnue}/${NETWORK_CIDR} |"
            echo "| VM démarrée | ${VM_STATUS:-inconnu} |"
            echo "| Nginx / site | ${SITE_DEPLOYED:-false} |"
            echo "| Racine Web | ${WEB_ROOT} |"
          } >> "$GITHUB_STEP_SUMMARY"
