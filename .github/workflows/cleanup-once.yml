name: Nettoyage unique GitHub

on:
  push:
    paths:
      - '.github/workflows/cleanup-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Supprimer les branches obsolètes
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'design/favicon-ai-montagnes'
            'feature/animated-breakings'
            'feature/automatic-post-images'
            'feature/full-header-banner'
            'feature/latest-four-resized-images'
            'media/finalize-local-images'
            'media/import-local-assets-v2'
          )

          for branch in "${branches[@]}"; do
            echo "Suppression de $branch"
            git push origin --delete "$branch" || true
          done

      - name: Supprimer les anciens runs GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '1 minute ago' +%s)"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv' \
            > /tmp/runs.tsv

          while IFS=$'\t' read -r run_id created_at; do
            [ -n "$run_id" ] || continue
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$created_epoch" -lt "$cutoff" ] && [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Suppression du run $run_id ($created_at)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
            fi
          done < /tmp/runs.tsv
