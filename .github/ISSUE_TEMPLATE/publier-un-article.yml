name: Publier un article
description: Créer une nouvelle publication AuvergneInfo depuis GitHub
title: "[ARTICLE] "
body:
  - type: markdown
    attributes:
      value: |
        Remplis ce formulaire. Une fois l'issue créée, GitHub Actions générera automatiquement l'article.

        **Gestion automatique de la vignette :**
        1. si une image principale est renseignée ci-dessous, elle est utilisée ;
        2. sinon, si le contenu de l'article commence par une image, cette image est utilisée ;
        3. sinon, `pdd.jpg` est utilisée automatiquement.

  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Une ou deux phrases affichées sur les listes d'articles et dans les résultats de recherche.
      placeholder: Résumé de l'article...
    validations:
      required: true

  - type: dropdown
    id: categorie
    attributes:
      label: Catégorie
      options:
        - Actualités
        - Guides
        - Technique
        - Auvergne
        - Événements
        - Autre
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Sépare les tags avec des virgules.
      placeholder: auvergne, réseau, sécurité

  - type: input
    id: image
    attributes:
      label: Image principale (optionnelle)
      description: "Pour forcer une vignette : chemin depuis public, par exemple uploads/2026/01/image.png, ou URL complète. Laisse vide pour la détection automatique."
      placeholder: uploads/2026/01/mon-image.png

  - type: textarea
    id: contenu
    attributes:
      label: Contenu
      description: Le corps de l'article en Markdown. Pour utiliser automatiquement une image comme vignette, place-la tout au début du contenu.
      placeholder: |
        ![Illustration](https://exemple.fr/image.jpg)

        ## Mon titre

        Le contenu de l'article...
    validations:
      required: true
