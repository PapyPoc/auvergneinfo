name: Publier un article
description: Créer une nouvelle publication AuvergneInfo depuis GitHub
title: "[ARTICLE] "
body:
  - type: markdown
    attributes:
      value: |
        Remplis ce formulaire. Une fois l'issue créée, GitHub Actions générera automatiquement l'article puis déclenchera le déploiement du site.

        **Images :**
        - tu peux glisser-déposer une image dans la zone **Image principale** ;
        - tu peux aussi glisser-déposer des images directement dans **Contenu**, exactement à l'endroit où elles doivent apparaître ;
        - GitHub générera automatiquement le Markdown de l'image.

        **Gestion automatique de la vignette :**
        1. si une image principale est déposée ou renseignée, elle est utilisée ;
        2. sinon, si le contenu commence par une image, cette image est utilisée ;
        3. sinon, `pdd.jpg` est utilisée automatiquement.

  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Une ou deux phrases affichées sur les listes d'articles et dans les résultats de recherche.
      placeholder: Résumé de l'article...
    validations:
      required: true

  - type: dropdown
    id: categorie
    attributes:
      label: Catégorie
      options:
        - Actualités
        - Guides
        - Technique
        - Auvergne
        - Événements
        - Autre
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Sépare les tags avec des virgules.
      placeholder: auvergne, réseau, sécurité

  - type: textarea
    id: image
    attributes:
      label: Image principale (optionnelle)
      description: Glisse-dépose ici l'image principale, ou saisis un chemin depuis public / une URL complète. Laisse vide pour la détection automatique.
      placeholder: |
        Glisse-dépose une image ici…

        Ou indique par exemple : uploads/2026/01/mon-image.png

  - type: textarea
    id: contenu
    attributes:
      label: Contenu
      description: Le corps de l'article en Markdown. Tu peux glisser-déposer des images directement ici, à l'endroit exact où elles doivent apparaître.
      placeholder: |
        ## Mon titre

        Le contenu de l'article...

        Glisse-dépose une image ici si nécessaire.
    validations:
      required: true
