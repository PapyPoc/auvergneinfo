server {
    listen 80 default_server;

    server_name auvergneinfo.fr www.auvergneinfo.fr;

    root /var/www/auvergneinfo;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Les fichiers générés par Astro dans /_astro/ sont versionnés par leur nom.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Astro est exporté en statique avec trailingSlash=always.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Ne jamais exposer les fichiers cachés, sauf .well-known pour un futur ACME.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
